<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#111411">
  <meta name="description" content="Mobile training program reference.">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Training Log</title>
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./icons/app-icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="./icons/app-icon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./styles.css">
  <script src="https://unpkg.com/lucide@0.468.0/dist/umd/lucide.min.js"></script>
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <div>
        <p class="eyebrow">Active program</p>
        <h1 id="program-name">Training Log</h1>
      </div>
    </header>

    <nav id="phase-tabs" class="phase-tabs" aria-label="Training phases"></nav>
    <nav id="workout-strip" class="workout-strip" aria-label="Training sessions"></nav>

    <main>
      <div id="workout-view"></div>
    </main>

    <footer><span>TRAINING LOG</span><span>8 week program</span></footer>
  </div>

  <script type="module" src="./js/app.js"></script>
</body>
</html>
